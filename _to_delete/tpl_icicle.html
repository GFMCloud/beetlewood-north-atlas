<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beetlewood Farms North - Icicle View</title>
<style>
:root{
  --bg:#fcfcfb; --panel:#ffffff; --panel-2:#f7f6f3;
  --line:#e6e4df; --line-soft:#efeeea;
  --ink:#1a1a19; --ink-2:#5c5a54; --ink-3:#8a8780;
  --accent:#2a78d6; --accent-soft:#eaf1fc;
  --surface:#fcfcfb;
  --shadow:0 1px 2px rgba(26,26,25,.05), 0 8px 24px -12px rgba(26,26,25,.14);
  --c-Insecta:#2a78d6; --c-Plantae:#eb6834; --c-Aves:#1baf7a; --c-Fungi:#eda100;
  --c-Arachnida:#e87ba4; --c-Reptilia:#008300; --c-Amphibia:#4a3aa7;
  --c-Mammalia:#e34948; --c-other:#b7b4aa;
}
html[data-theme="dark"]{
  --bg:#1a1a19; --panel:#232322; --panel-2:#1f1f1e;
  --line:#34342f; --line-soft:#2b2b28;
  --ink:#f0efe9; --ink-2:#a8a59c; --ink-3:#75736b;
  --accent:#3987e5; --accent-soft:#1e2a3b;
  --surface:#1a1a19;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  --c-Insecta:#3987e5; --c-Plantae:#d95926; --c-Aves:#199e70; --c-Fungi:#c98500;
  --c-Arachnida:#d55181; --c-Reptilia:#008300; --c-Amphibia:#9085e9;
  --c-Mammalia:#e66767; --c-other:#6f6d64;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease, color .2s ease;
}
header{
  display:flex; align-items:baseline; gap:14px;
  padding:18px 24px 16px; border-bottom:1px solid var(--line); background:var(--panel);
}
h1{margin:0; font-size:17px; font-weight:600; letter-spacing:-.01em}
.sub{font-size:13.5px; color:var(--ink-3)}
.spacer{flex:1}
button.ghost{
  font:inherit; font-size:13px; color:var(--ink-2); background:transparent;
  border:1px solid var(--line); border-radius:7px; padding:6px 12px; cursor:pointer;
  transition:background .15s ease, border-color .15s ease, color .15s ease;
}
button.ghost:hover{background:var(--panel-2); color:var(--ink); border-color:var(--ink-3)}
.bar{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:13px 24px; border-bottom:1px solid var(--line-soft); background:var(--panel);
}
.seg{display:inline-flex; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:2px}
.seg button{
  font:inherit; font-size:13px; color:var(--ink-2); background:transparent; border:0;
  border-radius:6px; padding:5px 13px; cursor:pointer; transition:background .15s ease, color .15s ease;
}
.seg button.on{background:var(--panel); color:var(--ink); font-weight:500; box-shadow:0 1px 2px rgba(0,0,0,.06)}
.lbl{font-size:12px; color:var(--ink-3); letter-spacing:.03em; text-transform:uppercase}
.legend{display:flex; flex-wrap:wrap; gap:13px; align-items:center}
.lg{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2)}
.lg i{width:9px; height:9px; border-radius:2.5px; display:block}
/* path bar */
.pathbar{
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  padding:13px 24px; background:var(--panel-2); border-bottom:1px solid var(--line);
  font-size:13.5px; min-height:48px;
}
.pathbar a{
  color:var(--ink-2); text-decoration:none; cursor:pointer;
  padding:3px 9px; border-radius:6px; border:1px solid transparent;
  transition:background .15s ease, color .15s ease, border-color .15s ease;
}
.pathbar a:hover{color:var(--accent); background:var(--accent-soft); border-color:var(--accent)}
.pathbar .cur{color:var(--ink); font-weight:600; padding:3px 9px}
.pathbar .sep{color:var(--ink-3); opacity:.6}
.pathbar .sci, .sci{font-style:italic}
.pathbar .up{margin-left:auto; font-size:12.5px; color:var(--ink-3)}
/* chart */
.wrap{padding:20px 24px 8px; overflow-x:auto}
svg{display:block; max-width:100%; height:auto}
rect.block{cursor:pointer}
rect.block:hover{opacity:.85}
text.blk{pointer-events:none; user-select:none; fill:#fff; font-size:11.5px}
html[data-theme="dark"] text.blk{fill:#14140f}
text.blk .ct{opacity:.75}
text.rank{fill:var(--ink-3); font-size:11px; letter-spacing:.06em; text-transform:uppercase; user-select:none}
/* readout */
.readout{
  padding:8px 24px 30px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; min-height:52px;
}
.readout .sw{width:11px; height:11px; border-radius:3px; flex:0 0 auto}
.readout .nm{font-size:16px; font-weight:600; letter-spacing:-.01em}
.readout .meta{font-size:13.5px; color:var(--ink-3)}
a.btn{
  font-size:13px; text-decoration:none; color:var(--ink-2);
  background:var(--panel); border:1px solid var(--line); border-radius:7px;
  padding:7px 12px; display:inline-flex; align-items:center; gap:6px;
  transition:border-color .15s ease, color .15s ease, background .15s ease;
}
a.btn:hover{color:var(--accent); border-color:var(--accent); background:var(--accent-soft)}
.note{padding:0 24px 46px; font-size:12.5px; color:var(--ink-3); line-height:1.6; max-width:900px}
#tip{
  position:fixed; pointer-events:none; opacity:0; z-index:20;
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  box-shadow:var(--shadow); padding:9px 12px; font-size:13px; max-width:280px;
  transition:opacity .12s ease;
}
#tip .t{font-weight:600; margin-bottom:2px}
#tip .r{font-size:11px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.03em}
#tip .v{color:var(--ink-2); margin-top:4px; font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<header>
  <h1>Beetlewood Farms North</h1>
  <span class="sub" id="hsub"></span>
  <span class="spacer"></span>
  <button class="ghost" id="theme">Dark</button>
</header>

<div class="bar">
  <span class="lbl">Block size</span>
  <span class="seg" id="metric">
    <button data-m="o" class="on">Observations</button>
    <button data-m="s">Distinct taxa</button>
  </span>
  <span class="lbl">Flow</span>
  <span class="seg" id="orient">
    <button data-o="h" class="on">Left to right</button>
    <button data-o="v">Top down</button>
  </span>
  <span class="spacer"></span>
  <span class="legend" id="legend"></span>
</div>

<div class="pathbar" id="pathbar"></div>
<div class="wrap"><svg id="chart"></svg></div>
<div class="readout" id="readout"></div>
<div class="note" id="note"></div>
<div id="tip"></div>

<script>/*__D3__*/</script>
<script id="treeData" type="application/json">/*__DATA__*/</script>
<script>
(function(){
"use strict";

const DATA = JSON.parse(document.getElementById('treeData').textContent);
const META = DATA.meta;
const SCI = new Set(['genus','species','subspecies','subgenus','stub']);
const RANK_LABEL = {root:'the farm', class:'class', order:'order', family:'family',
  genus:'genus', species:'species', subspecies:'subspecies', subgenus:'subgenus',
  subfamily:'subfamily', tribe:'tribe', superfamily:'superfamily',
  stub:'partial ID', unresolved:'unplaced'};
const RANK_AXIS = ['farm','class','order','family','genus','species'];
const CLASSES = ['Insecta','Plantae','Aves','Fungi','Arachnida','Reptilia','Amphibia','Mammalia'];
const cssColor = n => getComputedStyle(document.documentElement)
  .getPropertyValue('--c-' + (CLASSES.includes(n) ? n : 'other')).trim();

let metric = 'o', orient = 'h';
let root, focus, selected = null;

// geometry per orientation: CROSS = axis siblings share, DEPTH = rank axis
const GEO = {
  h: {cross: 800, depth: 1140, W: 1140, H: 800},
  v: {cross: 1140, depth: 660, W: 1140, H: 660}
};
const g = () => GEO[orient];

const svg = d3.select('#chart')
  .attr('preserveAspectRatio','xMidYMid meet')
  .style('width','100%').style('max-width','1140px').style('height','auto')
  .style('font-family','inherit');
// Zooming pushes out-of-focus branches far outside the plot box; without a clip
// they bleed over the rank labels.
const clipRect = svg.append('defs').append('clipPath').attr('id','plotclip').append('rect');
const gRect = svg.append('g').attr('clip-path','url(#plotclip)');
const gText = svg.append('g').attr('pointer-events','none').attr('clip-path','url(#plotclip)');
const gAxis = svg.append('g').attr('pointer-events','none');

function build(){
  const h = d3.hierarchy(DATA.tree, d => d.k)
    .sum(d => (d.k && d.k.length) ? 0 : (metric === 'o' ? d.o : 1))
    .sort((a, b) => b.value - a.value);
  // No layout padding: at 950 leaves a species block is under 1px tall, and padding
  // would erase it entirely — making a dense column read as empty white. Separation
  // comes from the stroke below, which is suppressed on sub-pixel blocks.
  root = d3.partition().size([g().cross, g().depth])(h);
  root.each(d => d.current = {x0:d.x0, x1:d.x1, y0:d.y0, y1:d.y1});
  focus = root;
}

// map partition coords -> screen rect for the active orientation
function box(c){
  return orient === 'h'
    ? {x: c.y0, y: c.x0, w: Math.max(0, c.y1 - c.y0), h: Math.max(0, c.x1 - c.x0)}
    : {x: c.x0, y: c.y0, w: Math.max(0, c.x1 - c.x0), h: Math.max(0, c.y1 - c.y0)};
}
function classOf(d){ let c = d; while (c.depth > 1 && c.parent) c = c.parent; return c.data.c || 'other'; }
// 2px surface gap between blocks, but only where there is room for one
function gap(c){ const b = box(c); return (b.h > 3 && b.w > 3) ? 1 : 0; }
const depthOpacity = d => [1, 1, .87, .76, .67, .59, .53][Math.min(6, d)];

function draw(){
  clipRect.attr('x', 0).attr('y', 0).attr('width', g().W).attr('height', g().H);
  const nodes = root.descendants();

  gRect.selectAll('rect').remove();
  gText.selectAll('text').remove();

  gRect.selectAll('rect').data(nodes, key).join('rect')
    .attr('class','block')
    .attr('x', d => box(d.current).x).attr('y', d => box(d.current).y)
    .attr('width', d => box(d.current).w).attr('height', d => box(d.current).h)
    .attr('rx', 3)
    .attr('fill', d => d.depth === 0 ? 'var(--ink-3)' : cssColor(classOf(d)))
    .attr('fill-opacity', d => depthOpacity(d.depth))
    .attr('stroke','var(--surface)').attr('stroke-width', d => gap(d.current))
    .on('mouseenter', showTip).on('mousemove', moveTip).on('mouseleave', hideTip)
    .on('click', (e,d) => { e.stopPropagation(); select(d); if (d.children) zoom(d); });

  gText.selectAll('text').data(nodes, key).join('text')
    .attr('class','blk')
    .style('font-style', d => SCI.has(d.data.r) ? 'italic' : 'normal')
    .call(place);

  axis();
  pathbar();
}
function key(d){ return d.ancestors().map(a => a.data.n).join('>'); }

function place(sel){
  sel.each(function(d){
    const b = box(d.current), t = d3.select(this);
    t.selectAll('*').remove();
    const fits = orient === 'h' ? (b.h >= 13 && b.w > 34) : (b.w >= 34 && b.h >= 13);
    t.attr('fill-opacity', fits ? 1 : 0);
    if (!fits) return;
    const avail = (orient === 'h' ? b.w : b.w) - 14;
    const name = truncate(d.depth === 0 ? 'Everything' : d.data.n, avail);
    t.attr('x', b.x + 7).attr('y', b.y + b.h / 2).attr('dy','0.35em').text(name);
    const cnt = String(metric === 'o' ? d.data.o : d.data.s);
    if (avail > name.length * 6.6 + cnt.length * 6.6 + 14){
      t.append('tspan').attr('class','ct').attr('dx', 8).text(cnt);
    }
  });
}
function truncate(s, px){
  const max = Math.max(1, Math.floor(px / 6.6));
  return s.length > max ? s.slice(0, Math.max(1, max - 1)) + '…' : s;
}

function axis(){
  gAxis.selectAll('*').remove();
  const depth = focus.depth;
  const shown = RANK_AXIS.slice(depth);
  const step = g().depth / (root.height + 1);
  shown.forEach((r, i) => {
    if (i > root.height) return;
    const t = gAxis.append('text').attr('class','rank').text(r);
    if (orient === 'h') t.attr('x', i * step + 2).attr('y', -6);
    else t.attr('x', -4).attr('y', i * step + 14).attr('text-anchor','end');
  });
  svg.attr('viewBox', orient === 'h'
    ? [0, -20, g().W, g().H + 24]
    : [-56, 0, g().W + 60, g().H + 6]);
}

function zoom(p){
  focus = p;
  const span = (p.x1 - p.x0) || 1;
  root.each(d => d.target = {
    x0: (d.x0 - p.x0) / span * g().cross,
    x1: (d.x1 - p.x0) / span * g().cross,
    y0: d.y0 - p.y0,
    y1: d.y1 - p.y0
  });

  const t = svg.transition().duration(720).ease(d3.easeCubicOut);

  gRect.selectAll('rect').transition(t)
    .tween('data', d => { const i = d3.interpolate(d.current, d.target); return x => d.current = i(x); })
    .attrTween('x', d => () => box(d.current).x)
    .attrTween('y', d => () => box(d.current).y)
    .attrTween('width', d => () => box(d.current).w)
    .attrTween('height', d => () => box(d.current).h)
    .attrTween('stroke-width', d => () => gap(d.current));

  gText.selectAll('text').transition(t)
    .tween('reposition', function(d){ const node = this; return () => d3.select(node).call(place); });

  axis();
  pathbar();
}

// ── chrome ──────────────────────────────────────────────────────────────────
function valTxt(d){
  const o = d.data.o, s = d.data.s;
  return o.toLocaleString() + (o === 1 ? ' observation' : ' observations') +
    (d.children ? ' · ' + s.toLocaleString() + (s === 1 ? ' taxon' : ' taxa') : '');
}
function inatLink(d){
  const base = 'https://www.inaturalist.org/observations?user_id=roymorrisii&lat=' +
    META.lat + '&lng=' + META.lng + '&radius=' + META.radius_km + '&subview=grid';
  return d.data.id ? base + '&taxon_id=' + d.data.id : base;
}
function select(d){ selected = d; readout(); }

function pathbar(){
  const el = document.getElementById('pathbar');
  el.replaceChildren();
  const chain = focus.ancestors().reverse();
  chain.forEach((a, i) => {
    if (i){ const s = document.createElement('span'); s.className='sep'; s.textContent='›'; el.appendChild(s); }
    const cur = a === focus;
    const n = document.createElement(cur ? 'span' : 'a');
    n.textContent = a.depth === 0 ? 'Everything on the farm' : a.data.n;
    n.className = (cur ? 'cur ' : '') + (SCI.has(a.data.r) ? 'sci' : '');
    if (!cur) n.addEventListener('click', () => { select(a); zoom(a); });
    el.appendChild(n);
  });
  const up = document.createElement('span');
  up.className = 'up';
  up.textContent = focus.parent ? 'Click a block to go deeper, or a step above to come back'
                                : 'Click any block to zoom into it';
  el.appendChild(up);
}

function readout(){
  const el = document.getElementById('readout');
  el.replaceChildren();
  const d = selected;
  if (!d){
    const p = document.createElement('span'); p.className = 'meta';
    p.textContent = 'Hover a block for detail; click to zoom that branch open.';
    el.appendChild(p); return;
  }
  const sw = document.createElement('span');
  sw.className = 'sw'; sw.style.background = cssColor(classOf(d)); el.appendChild(sw);
  const nm = document.createElement('span');
  nm.className = 'nm' + (SCI.has(d.data.r) ? ' sci' : '');
  nm.textContent = d.depth === 0 ? 'Everything on the farm' : d.data.n; el.appendChild(nm);
  if (d.data.cm){
    const c = document.createElement('span'); c.className='meta';
    c.style.textTransform='capitalize'; c.textContent = d.data.cm; el.appendChild(c);
  }
  const rk = document.createElement('span'); rk.className='meta';
  rk.textContent = RANK_LABEL[d.data.r] || d.data.r; el.appendChild(rk);
  const mt = document.createElement('span'); mt.className='meta';
  mt.textContent = valTxt(d); el.appendChild(mt);
  const a = document.createElement('a');
  a.className='btn'; a.href = inatLink(d); a.target='_blank'; a.rel='noopener';
  a.textContent = 'His records ↗'; el.appendChild(a);
  if (d.data.id){
    const b = document.createElement('a');
    b.className='btn'; b.href = 'https://www.inaturalist.org/taxa/' + d.data.id;
    b.target='_blank'; b.rel='noopener'; b.textContent = 'Taxon page ↗'; el.appendChild(b);
  }
}

const tip = document.getElementById('tip');
function showTip(e, d){
  tip.replaceChildren();
  const t = document.createElement('div'); t.className='t';
  t.textContent = d.depth === 0 ? 'Everything on the farm' : d.data.n;
  if (SCI.has(d.data.r)) t.style.fontStyle='italic';
  tip.appendChild(t);
  if (d.data.cm){
    const c = document.createElement('div'); c.className='r';
    c.style.textTransform='capitalize'; c.textContent = d.data.cm; tip.appendChild(c);
  }
  const r = document.createElement('div'); r.className='r';
  r.textContent = RANK_LABEL[d.data.r] || d.data.r; tip.appendChild(r);
  const v = document.createElement('div'); v.className='v'; v.textContent = valTxt(d); tip.appendChild(v);
  tip.style.opacity = 1; moveTip(e);
}
function moveTip(e){
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y + h > innerHeight - 8) y = e.clientY - h - pad;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip(){ tip.style.opacity = 0; }

document.getElementById('hsub').textContent =
  `${META.total_obs.toLocaleString()} observations · ${DATA.tree.s.toLocaleString()} taxa · ${META.year_min}–${META.year_max}`;

(function legend(){
  const el = document.getElementById('legend');
  const present = (DATA.tree.k || []).map(k => k.n);
  const shown = CLASSES.filter(c => present.includes(c));
  const others = present.filter(p => !CLASSES.includes(p));
  shown.concat(others.length ? ['other'] : []).forEach(name => {
    const s = document.createElement('span'); s.className='lg';
    const i = document.createElement('i'); i.style.background = cssColor(name);
    s.appendChild(i); s.appendChild(document.createTextNode(name === 'other' ? 'other groups' : name));
    if (name === 'other') s.title = others.join(', ');
    el.appendChild(s);
  });
})();

document.getElementById('note').textContent =
  'Each band is one taxonomic rank, running from the whole farm down to species. ' +
  'Block size is the number of records, so Lepidoptera dwarfs everything ' +
  'else — that is the real shape of his logging. Colour follows the class throughout. ' +
  'Order, family and genus come from iNaturalist’s taxonomy, fetched live from their API; ' +
  'records identified only as far as a genus show up as a “sp.” block so the counts still ' +
  'total ' + META.total_obs.toLocaleString() + '.';

document.getElementById('metric').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  metric = b.dataset.m;
  document.querySelectorAll('#metric button').forEach(x => x.classList.toggle('on', x === b));
  build(); draw(); selected = null; readout();
});
document.getElementById('orient').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  orient = b.dataset.o;
  document.querySelectorAll('#orient button').forEach(x => x.classList.toggle('on', x === b));
  build(); draw(); selected = null; readout();
});
document.getElementById('theme').addEventListener('click', e => {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  e.target.textContent = dark ? 'Dark' : 'Light';
  gRect.selectAll('rect').attr('fill', d => d.depth === 0 ? 'var(--ink-3)' : cssColor(classOf(d)));
  document.querySelectorAll('#legend .lg i').forEach(i => {
    const nm = i.parentElement.textContent.trim();
    i.style.background = cssColor(nm === 'other groups' ? 'other' : nm);
  });
  readout();
});

build(); draw(); readout();
})();
</script>
</body>
</html>
